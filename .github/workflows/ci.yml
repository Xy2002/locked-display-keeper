name: macOS build and smoke checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build native executable
        run: ./scripts/build.sh
      - name: Run smoke checks
        run: ./tests/smoke.sh
      - name: Build universal download package
        if: matrix.runner == 'macos-15'
        run: ./scripts/package.sh
